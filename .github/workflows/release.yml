name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v2.1.0'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Generate temporary release keystore
        working-directory: android
        run: |
          keytool -genkeypair \
            -v \
            -keystore app/release-ci.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=LiquidUI,O=MonkeyCode,C=CN"
        env:
          STORE_PASSWORD: ${{ github.run_id }}-store
          KEY_PASSWORD: ${{ github.run_id }}-key

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --console=plain \
            -PRELEASE_STORE_FILE=app/release-ci.jks \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS=release \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
        env:
          STORE_PASSWORD: ${{ github.run_id }}-store
          KEY_PASSWORD: ${{ github.run_id }}-key

      - name: Rename release APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/liquidui-${RELEASE_TAG}-release.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidui-release-apk
          path: release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Liquid UI ${{ env.RELEASE_TAG }}
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
