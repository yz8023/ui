name: Build Release APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 platform
        run: yes | sdkmanager "platforms;android-36" >/dev/null

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK (minified, debug-sign fallback)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-motion-ui-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
